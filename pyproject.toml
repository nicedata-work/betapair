[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betapair"
version = "0.1.0"
description = "Dependency-light Bayesian analysis of paired binary outcomes with a hierarchical McNemar test and multi-strata pooling."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nicedata" }]
keywords = [
    "bayesian",
    "mcnemar",
    "paired",
    "statistics",
    "hierarchical",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/nicedata-work/betapair"
Repository = "https://github.com/nicedata-work/betapair"
Issues = "https://github.com/nicedata-work/betapair/issues"
Changelog = "https://github.com/nicedata-work/betapair/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/betapair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src", "tools"]

[tool.coverage.run]
source = ["src/betapair"]

[tool.coverage.report]
show_missing = true
skip_covered = true
