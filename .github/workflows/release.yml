name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; jobs opt into what they need. The cache used by
# setup-uv runs on ACTIONS_RUNTIME_TOKEN, so it is unaffected by this block.
permissions:
  contents: read

jobs:
  check:
    name: check the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # Read the version back off the installed package, so the tag, the
      # pyproject version and what actually ships cannot disagree.
      - name: Tag and package version agree
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run python -c "import betapair; print(betapair.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packaged version $version"
            exit 1
          fi
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  build:
    name: build distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    # A manual run from a branch must not try to upload an existing version.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Configure this environment in the repo settings and register it as a
    # trusted publisher for the `betapair` project on PyPI. No API token is
    # needed once that is done. PEP 740 attestations are generated by default.
    environment:
      name: pypi
      url: https://pypi.org/p/betapair
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: publish the GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" { found = 1; next } found && /^## \[/ { exit } found' \
            CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes --verify-tag
          fi
