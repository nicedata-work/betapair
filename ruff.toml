# Same as Black.
line-length = 100
indent-width = 4

extend-exclude = [".venv"]

[lint]
select = [
  # Pyflakes (`F`), a subset of pycodestyle (`E`), import sorting (`I`),
  # pyupgrade (`UP`), bugbear (`B`), simplify (`SIM`), pydocstyle (`D`) and
  # ruff's own (`RUF`).
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "D",
  "RUF",
]
# Docstrings follow Google style (napoleon/IDE readable). Magic methods and
# ``__init__`` are documented by their class; completeness elsewhere is
# enforced.
ignore = ["D105", "D107"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests and tooling are not part of the documented public surface.
"tests/**" = ["D"]
"tools/**" = ["D"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
